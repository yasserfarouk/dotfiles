# sesh: smart tmux session manager (picker on Alt-s in tmux, see ~/bin/sesh-pick)
sort_order = ["tmux", "tmuxinator", "config", "zoxide"]
# folder shortcuts as sessions, generated by `shortcut sync` from ~/.config/shortcuts/dirs
import = ["~/.config/sesh/shortcuts.toml"]

[default_session]
preview_command = "eza --all --git --icons --color=always --group-directories-first {}"
