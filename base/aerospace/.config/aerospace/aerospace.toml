    if.app-id = 'com.knollsoft.Superkey'
    run = 'layout floating'
[[on-window-detected]]
    if.app-id = 'onebadidea.Swift-Quit'
    run = 'layout floating'
[[on-window-detected]]
    if.app-id = 'com.stonerl.Thaw'
    run = 'layout floating'
[[on-window-detected]]
    if.app-id = 'com.ameba.TRex'
    run = 'layout floating'
[[on-window-detected]]
    if.app-id = 'com.unsplash.Wallpapers'
    run = 'layout floating'
[[on-window-detected]]
    if.app-id = 'com.zscaler.zscaler'
    run = 'layout floating'
[[on-window-detected]]
    if.app-id = 'com.epson.edca'
    run = 'layout floating'

# The workmux dashboard window (~/bin/wm-dash, Alfred `wm`) floats; wm-dash centers and raises it.
[[on-window-detected]]
    if.app-id = 'net.kovidgoyal.kitty'
    if.window-title-regex-substring = '^workmux-dashboard$'
    run = 'layout floating'

# floating kitty shell (Alfred `term`, ⌥↩ → alfred-kitty term --float)
[[on-window-detected]]
    if.app-id = 'net.kovidgoyal.kitty'
    if.window-title-regex-substring = '^kitty-float '
    run = 'layout floating'

# Home workspaces for the Hyper-key apps (app-ws.sh): Outlook/Teams → 4, Koma → 9; meeting windows
# (Teams, Zoom) → Z via meeting-ws.sh, Google Meet links → Z via browser-here.sh. kitty, Safari and
# Edge are not routed (links open where you click them; alt-shift-b sends a browser window home).
[[on-window-detected]]
    if.app-id = 'com.microsoft.Outlook'
    run = 'move-node-to-workspace 4'
[[on-window-detected]]
    if.app-id = 'com.microsoft.teams2'
    run = ['move-node-to-workspace 4', 'exec-and-forget ~/.config/aerospace/meeting-ws.sh']   # meeting windows → Z
[[on-window-detected]]
    if.app-id = 'us.zoom.xos'
    run = ['exec-and-forget ~/.config/aerospace/meeting-ws.sh', 'exec-and-forget ~/.config/aerospace/layout-cycle.sh regrid']   # "Zoom Meeting" → Z
[[on-window-detected]]
    if.app-id = 'com.apple.Safari.WebApp.56AA5E4D-53C5-45DC-A65F-07DCC0084513'   # Koma App (koma-app-id.sh)
    run = 'move-node-to-workspace 9'

# Grid is the default layout: rebuild grid/master-accordion/main/two when a tiled window appears on the focused workspace
# (last, so the floating rules above match first and stop here).
[[on-window-detected]]
    if = 'true'
    run = 'exec-and-forget ~/.config/aerospace/layout-cycle.sh regrid'
