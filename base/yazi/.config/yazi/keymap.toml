# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.
#
# Only overrides: yazi's built-in preset supplies every other binding, so it stays current across releases.

[[mgr.prepend_keymap]]
on   = "z"
run  = "plugin zoxide"
desc = "Jump to a directory via zoxide"

[[mgr.prepend_keymap]]
on   = "Z"
run  = "plugin fzf"
desc = "Jump to a file/directory via fzf"

[[mgr.prepend_keymap]]
on   = [ "g", "c" ]
run  = "cd ~/code"
desc = "Go ~/code"

[[mgr.prepend_keymap]]
on   = [ "g", "C" ]
run  = "cd ~/.config"
desc = "Go ~/.config"

[[mgr.prepend_keymap]]
on   = [ "g", "D" ]
run  = "cd ~/Desktop"
desc = "Go ~/Desktop"

[[mgr.prepend_keymap]]
on   = [ "g", "p" ]
run  = "cd ~/code/projects"
desc = "Go ~/code/projects"

[[mgr.prepend_keymap]]
on   = [ "g", "P" ]
run  = "cd ~/code/papers"
desc = "Go ~/code/papers"

[[mgr.prepend_keymap]]
on   = [ "g", "u" ]
run  = "cd ~/code/papers/current"
desc = "Go ~/code/papers/current"

[[mgr.prepend_keymap]]
on   = [ "g", "l" ]
run  = "cd ~/code/presentations"
desc = "Go ~/code/presentations"

[[mgr.prepend_keymap]]
on   = [ "g", "i" ]
run  = "cd '~/Library/Mobile Documents/com~apple~CloudDocs'"
desc = "Go iCloud Drive"

[[help.prepend_keymap]]
on   = "f"
run  = "filter"
desc = "Filter help items"

[[mgr.prepend_keymap]]
on   = "P"
run  = "plugin smart-paste"
desc = "Paste into the hovered directory or CWD"

[[mgr.prepend_keymap]]
on   = "t"
run  = "plugin smart-tab"
desc = "Create a tab and enter the hovered directory"

[[mgr.prepend_keymap]]
on   = "2"
run  = "plugin smart-switch 1"
desc = "Switch or create tab 2"

[[mgr.prepend_keymap]]
on = [ "g", "r" ]
run = '''
	shell 'ya emit cd "$(git rev-parse --show-toplevel)"'
'''
[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize or restore preview"
[[mgr.prepend_keymap]]
on   = "<C-T>"
run  = "plugin toggle-pane min-preview"
desc = "Hide or show preview"
[[mgr.prepend_keymap]]
on = "<C-p>"
run = '''
  shell 'qlmanage -p %s'
'''

[[mgr.prepend_keymap]]
on = ["g", "<Enter>"]
run = '''
  shell 'qlmanage -p %s'
'''

# yamb bookmarks
[[mgr.prepend_keymap]]
on = [ "g", ";" ]
run = "plugin yamb -- jump_by_key"
desc = "Jump to bookmark by key"

[[mgr.prepend_keymap]]
on = [ "g", ":" ]
run = "plugin yamb -- jump_by_fzf"
desc = "Jump to bookmark via fzf"

[[mgr.prepend_keymap]]
on = [ "g", "A" ]
run = "plugin yamb -- save"
desc = "Save current dir as bookmark"

[[mgr.prepend_keymap]]
on = [ "g", "X" ]
run = "plugin yamb -- delete_by_key"
desc = "Delete bookmark by key"

[[mgr.prepend_keymap]]
on = [ "g", "R" ]
run = "plugin yamb -- rename_by_key"
desc = "Rename bookmark by key"

[[mgr.prepend_keymap]]
on = [ "g", "m" ]
run = '''
  shell --block '~/bin/sendto --pick %s'
'''
desc = "Move selection to a project folder (fzf over tmux Alt-g folders; ctrl-y copies)"

[[mgr.prepend_keymap]]
on = [ "g", "o" ]
run = '''
  shell 'open -R %s'
'''
desc = "Reveal selection (or hovered) in Finder"
