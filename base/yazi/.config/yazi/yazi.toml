# A TOML linter such as https://taplo.tamasfe.dev/ can use this schema to validate your config.
# If you encounter any issues, please make an issue at https://github.com/yazi-rs/schemas.

[mgr]
ratio          = [ 1, 4, 3 ]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse 	 = false
sort_dir_first = true
sort_translit  = false
linemode       = "none"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
mouse_events   = [ "click", "scroll" ]

[preview]
wrap            = "yes"
tab_size        = 2
max_width       = 600
max_height      = 900
cache_dir       = ""
image_delay     = 30
image_filter    = "triangle"
image_quality   = 75
ueberzug_scale  = 1
ueberzug_offset = [ 0, 0, 0, 0 ]

[opener]
# yazi 26+: files come in as placeholders %s (all, quoted), %s1 (first), %d1 (its folder); "$@"/"$1" are empty
edit = [
	{ run = '${EDITOR:-nvim} %s', desc = "$EDITOR", block = true, for = "unix" },
	{ run = 'code %s',    orphan = true, desc = "code",           for = "windows" },
	{ run = 'code -w %s', block = true,  desc = "code (block)",   for = "windows" },
]
open = [
	{ run = 'xdg-open %s1',                desc = "Open", for = "linux" },
	{ run = 'open %s',                     desc = "Open", for = "macos" },
	{ run = 'start "" %s1', orphan = true, desc = "Open", for = "windows" },
]
reveal = [
	{ run = 'xdg-open %d1',                        desc = "Reveal", for = "linux" },
	{ run = 'open -R %s1',                         desc = "Reveal", for = "macos" },
	{ run = 'explorer /select,%s1', orphan = true, desc = "Reveal", for = "windows" },
	{ run = 'exiftool %s1; echo "Press enter to exit"; read _', block = true, desc = "Show EXIF", for = "unix" },
]
extract = [
	{ run = 'ya pub extract --list %s', desc = "Extract here" },
]
play = [
	{ run = 'mpv --force-window %s', orphan = true },
	{ run = 'mediainfo %s1; echo "Press enter to exit"; read _', block = true, desc = "Show media info", for = "unix" },
]

[open]
rules = [
	# Folder
	{ url = "*/", use = [ "edit", "open", "reveal" ] },
	# Text
	{ mime = "text/*", use = [ "edit", "reveal" ] },
	# Image
	{ mime = "image/*", use = [ "open", "reveal" ] },
	# Media
	{ mime = "{audio,video}/*", use = [ "play", "reveal" ] },
	# Archive
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "reveal" ] },
	# JSON
	{ mime = "application/{json,ndjson}", use = [ "edit", "reveal" ] },
	{ mime = "*/javascript", use = [ "edit", "reveal" ] },
	# Empty file
	{ mime = "inode/empty", use = [ "edit", "reveal" ] },
	# Fallback
	{ url = "*", use = [ "open", "reveal" ] },
]

[tasks]
bizarre_retry    = 3
image_alloc      = 536870912  # 512MB
image_bound      = [ 0, 0 ]
suppress_preload = false

[plugin]

prepend_previewers = [
    # { url = "*.csv", run = "rich-preview"}, # for csv files
	 { url = "*.md", run = "glow" },
    # { url = "*.rst", run = "rich-preview"}, # for restructured text (.rst) files
	{ url = "*.ipynb", run = "nbpreview" },
    # { url = "*.json", run = "rich-preview"}, # for json (.json) files
#    { url = "*.lang_type", run = "rich-preview"} # for particular language files eg. .py, .go., .lua, etc.
    # Office documents (requires libreoffice + pdftoppm)
    { mime = "application/msword",                                                run = "office" },
    { mime = "application/vnd.ms-excel",                                          run = "office" },
    { mime = "application/vnd.ms-powerpoint",                                     run = "office" },
    { mime = "application/vnd.openxmlformats-officedocument.*",                   run = "office" },
    { mime = "application/vnd.oasis.opendocument.*",                              run = "office" },
]


