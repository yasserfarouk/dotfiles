# -- plugins (tpm) --------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'thewtex/tmux-mem-cpu-load'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'soyuka/tmux-current-pane-hostname'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'christoomey/vim-tmux-navigator'

# tmux-sessionx: session switcher with preview (Alt-i, no prefix)
set -g @sessionx-bind 'M-i'
set -g @sessionx-prefix off
set -g @sessionx-fzf-builtin-tmux 'on'
set -g @sessionx-window-width '95%'
set -g @sessionx-window-height '90%'
set -g @sessionx-preview-location 'right'
set -g @sessionx-preview-ratio '70%'
set -g @sessionx-layout 'reverse'
set -g @sessionx-filter-current 'true'
set -g @sessionx-zoxide-mode 'on'

# Machine-specific settings
if-shell 'ls ~/.tmux.conf.local' 'source-file ~/.tmux.conf.local' ''

# -- terminal -------------------------------------------------------------------

# auto-detect kitty or fall back to screen-256color
if-shell 'infocmp xterm-kitty' \
  'set -g default-terminal "xterm-kitty"; set-environment -g TERM "xterm-kitty"' \
  'set -g default-terminal "screen-256color"; set-environment -g TERM "screen-256color"'

set -g default-shell "/bin/zsh"
set -g default-command "/bin/zsh"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ',xterm-kitty:RGB'
set -as terminal-features ',screen-256color:RGB'

# OSC52 clipboard passthrough (lets remote nvim/yank reach the local system clipboard over ssh)
set -s set-clipboard on
set -as terminal-features ',xterm-kitty:clipboard'
set -as terminal-features ',xterm-256color:clipboard'
set -as terminal-features ',screen-256color:clipboard'

set -g update-environment "DISPLAY SSH_ASKPASS SSH_AUTH_SOCK SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# wezterm
set -g allow-passthrough on

# Extended keys for Ctrl+Enter and other modified keys (tmux 3.2+)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# restore window contents on exit from full-screen applications
setw -g alternate-screen on

# -- general --------------------------------------------------------------------

# prefix is C-space
set -g prefix C-space
bind C-space send-prefix
unbind C-b

setw -g mouse on
setw -g xterm-keys on
setw -q -g utf8 on

set -s escape-time 10                     # faster command sequences
set -sg repeat-time 300                   # increase repeat timeout
set -s focus-events on
set -g history-limit 5000                 # boost history

set -g base-index 1                       # number windows from 1
setw -g pane-base-index 1                 # number panes from 1
setw -g automatic-rename on               # rename window to reflect current program
set -g renumber-windows on                # renumber windows when a window is closed
set -g detach-on-destroy off              # do not detach when the last window is closed

set -g set-titles on                      # set terminal title
set -g set-titles-string '#h ❐ #S ● #I #W'

bind r source-file ~/.tmux.conf \; display "Reloaded!"

# -- panes and windows ----------------------------------------------------------

bind - split-window -v -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind = split-window -h -c "#{pane_current_path}"

bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

bind -n S-Left  previous-window
bind -n S-Right next-window
bind Tab last-window      # move to last active window

bind -n M-Left resize-pane -L 2
bind -n M-Right resize-pane -R 3
bind -n M-Up resize-pane -U 2
bind -n M-Down resize-pane -D 2

bind -n M-z resize-pane -Z
bind -n M-Q kill-pane
bind -n M-W kill-window
bind-key X confirm-before -p "Kill #S (y/n)?" "run-shell 'tmux switch-client -n; tmux kill-session -t \"#S\"'"
bind -n M-x confirm-before -p "Kill #S (y/n)?" "run-shell 'tmux switch-client -n; tmux kill-session -t \"#S\"'"
bind -n M-p switch-client -p
bind -n M-n switch-client -n

# Make semicolon behave like colon
bind-key \; command-prompt

bind C-l send-keys 'C-l'  # clear screen

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-;' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# -- copy mode ------------------------------------------------------------------

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi L send -X end-of-line

# copy to Mac OSX clipboard
if -b 'command -v reattach-to-user-namespace > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | reattach-to-user-namespace pbcopy"'
# copy to X11 clipboard
if -b 'command -v xsel > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | xsel -i -b"'
if -b '! command -v xsel > /dev/null 2>&1 && command -v xclip > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | xclip -i -selection clipboard >/dev/null 2>&1"'
# copy to Windows clipboard
if -b 'command -v clip.exe > /dev/null 2>&1' 'bind y run -b "tmux save-buffer - | clip.exe"'
if -b '[ -c /dev/clipboard ]' 'bind y run -b "tmux save-buffer - > /dev/clipboard"'

# Toggle monitoring activity in a window / synchronize-panes
bind m set monitor-activity
bind y set synchronize-panes\; display 'synchronize-panes #{?synchronize-panes,on,off}'

bind b list-buffers  # list paste buffers
bind p paste-buffer  # paste from the top paste buffer
bind P choose-buffer # choose which buffer to paste from

# popups: shell, join pane, kill sessions, project picker (Alt-i session switcher is tmux-sessionx, Alt-s is sesh)
bind t display-popup -E      "zsh"
bind -n M-t display-popup -E "zsh"
bind v display-popup -E      "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --height=100% --reverse | xargs tmux join-pane -t"
bind -n M-v display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --height=100% --reverse | xargs tmux join-pane -t"
bind w display-popup -E      "tmux list-sessions | awk '{print \$1}' | rg ':' -r '' | fzf --multi --height=100% --no-preview | xargs -n 1 tmux kill-session -t"
bind g display-popup -E      "{ zoxide query -l 2>/dev/null; fd . --type d --full-path $HOME/code --max-depth 2 & fd . --type d --full-path $HOME/code/papers --max-depth 4 & fd . --type d --full-path $HOME/koshodojo --max-depth 2; wait; } | sed 's:/\$::' | awk '!seen[\$0]++' | fzf --multi --height=100% --preview-window=right:50% --preview 'ls -A --color=always {} 2>/dev/null || ls -AG {}' | xargs -I {} tmuxinator any {}"
bind -n M-g display-popup -E "{ zoxide query -l 2>/dev/null; fd . --type d --full-path $HOME/code --max-depth 2 & fd . --type d --full-path $HOME/code/papers --max-depth 4 & fd . --type d --full-path $HOME/koshodojo --max-depth 2; wait; } | sed 's:/\$::' | awk '!seen[\$0]++' | fzf --multi --height=100% --preview-window=right:50% --preview 'ls -A --color=always {} 2>/dev/null || ls -AG {}' | xargs -I {} tmuxinator any {}"
# sesh session picker: tmux sessions, tmuxinator projects, zoxide dirs (Alt-s)
bind -n M-s display-popup -E -w 85% -h 75% "~/bin/sesh-pick"
# fuzzy window picker across all sessions with live preview (prefix-s, Alt-f); choose-tree moved to prefix-C-s
bind s display-popup -E -w 90% -h 80% "~/bin/tmux-window-pick"
bind -n M-f display-popup -E -w 90% -h 80% "~/bin/tmux-window-pick"
bind C-s choose-tree -Zs

# -- status bar -----------------------------------------------------------------

set-option -g status on
set-option -g status-interval 1
set-option -g status-justify centre
set-option -g status-keys vi
set-option -g status-position bottom
set-option -g status-style bg=default
set-option -g status-left-length 60
set-option -g status-left-style default
set-option -g status-left "#[fg=green]#H #[fg=black]• #[fg=green,bright]#S #[default]"
set-option -g status-right-length 70
set-option -g status-right-style default
set-option -g status-right "#[fg=blue,bg=default,bright]#(tmux-mem-cpu-load -a 0) "
set-option -ag status-right "#[fg=red,dim,bg=default]#(uptime | cut -f 4-5 -d ' ' | cut -f 1 -d ',') "
set-option -ag status-right " #[fg=white,bg=default]%a%l:%M:%S %p#[default] #[fg=blue]%Y-%m-%d"
set-window-option -g window-status-style bg=default
set-window-option -g window-status-current-style bg=default

# Keep at the very bottom: initializes tpm (must be last)
run '~/.tmux/plugins/tpm/tpm'
